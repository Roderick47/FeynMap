[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feynmap"
version = "3.0.0a1"
description = "Evidence-backed semantic infrastructure for AI-assisted software engineering"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "FeynMap Team"}]
keywords = ["static-analysis", "code-analysis", "ai", "semantic-graph", "developer-tools", "rust-migration"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "black>=24", "ruff>=0.6"]
mcp = ["mcp>=2,<3; python_version >= '3.10'"]

[project.scripts]
feynmap = "feynmap.cli:main"
feynmap-mcp = "feynmap.mcp_server:main"

[project.urls]
Repository = "https://github.com/Roderick47/FeynMap"

[tool.setuptools]
py-modules = [
  "change_impact",
  "component_metrics",
  "config",
  "feyn_notation",
  "feyn_parser",
  "framework_detection",
  "graph_schema",
  "impact_analysis",
  "main",
  "node_identity",
  "pipeline",
  "reachability",
  "trace_paths",
]

[tool.setuptools.package-data]
feynmap = ["data/*.json"]

[tool.setuptools.packages.find]
include = ["feynmap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
