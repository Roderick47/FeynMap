name: p1-external-semantic-baseline

on:
  push:
    paths:
      - "feynmap/p1_external_baseline.py"
      - "feynmap/adapters/**"
      - "feynmap/engine.py"
      - "feynmap/integration.py"
      - "feynmap/repository.py"
      - "feynmap/context_pipeline.py"
      - "experiments/p1_external_framework_manifest.json"
      - "tests/test_p1_external_baseline.py"
      - "tests/test_django_cbv_semantics.py"
      - "tests/test_django_app_membership.py"
      - "tests/test_django_named_urls.py"
      - "tests/test_flask_blueprint_composition.py"
      - "tests/test_django_drf_semantics.py"
      - "tests/test_p1_6_integration_diagnostics.py"
      - ".github/workflows/p1-external-baseline.yml"
  pull_request:
    paths:
      - "feynmap/p1_external_baseline.py"
      - "feynmap/adapters/**"
      - "feynmap/engine.py"
      - "feynmap/integration.py"
      - "feynmap/repository.py"
      - "feynmap/context_pipeline.py"
      - "experiments/p1_external_framework_manifest.json"
      - "tests/test_p1_external_baseline.py"
      - "tests/test_django_cbv_semantics.py"
      - "tests/test_django_app_membership.py"
      - ".github/workflows/p1-external-baseline.yml"
  workflow_dispatch:

jobs:
  baseline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: mdn-django-local-library
            repository: mdn/django-locallibrary-tutorial
            commit: 92f1c1e7bdd4ada5209a3c69876ce29e6cee3d96
          - fixture: grinberg-microblog
            repository: miguelgrinberg/microblog
            commit: a975ef64864354867c88e0ed3a17ba7d17dca752
          - fixture: django-rest-framework
            repository: encode/django-rest-framework
            commit: b578eab1cad040414b758131af1e17aa000b51e2
    steps:
      - name: Checkout exact FeynMap source
        uses: actions/checkout@v4
        with:
          path: feynmap-source
      - name: Checkout pinned external source (no dependencies installed)
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.commit }}
          path: external-source
          persist-credentials: false
      - name: Verify immutable external revision
        shell: bash
        run: |
          actual="$(git -C external-source rev-parse HEAD)"
          expected="${{ matrix.commit }}"
          echo "Pinned external checkout: $actual"
          test "$actual" = "$expected"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FeynMap only
        working-directory: feynmap-source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Analyze frozen external source and score source-authored probes
        shell: bash
        working-directory: feynmap-source
        run: |
          mkdir -p performance-results
          python -m feynmap.p1_external_baseline \
            --manifest experiments/p1_external_framework_manifest.json \
            --fixture "${{ matrix.fixture }}" \
            --project-root ../external-source \
            --output "performance-results/p1-${{ matrix.fixture }}.json"
      - name: Upload full P1.1b diagnostics even if a run exposes an analysis error
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-external-baseline-${{ matrix.fixture }}
          path: feynmap-source/performance-results/p1-${{ matrix.fixture }}.json
          if-no-files-found: warn

  collect:
    if: always()
    needs: baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: p1-external-baseline-*
          path: collected
          merge-multiple: true
      - name: Check report integrity but do NOT require unsupported semantic relations to pass yet
        env:
          P1_JOB_RESULT: ${{ needs.baseline.result }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(
              Path("experiments/p1_external_framework_manifest.json").read_text()
          )
          reports = {}
          for file in Path("collected").glob("p1-*.json"):
              payload = json.loads(file.read_text())
              name = payload["fixture_id"]
              if name in reports:
                  raise SystemExit("duplicate external fixture report: " + name)
              reports[name] = payload

          lines = [
              "## P1.1b immutable-source framework baseline",
              "",
              "| External source | Graph nodes | Graph edges | Source-authored probes met | Missing facts | Analysis ms | Peak RSS KB |",
              "|---|---:|---:|---:|---|---:|---:|",
          ]
          failed = False
          for fixture in manifest["fixtures"]:
              name = fixture["id"]
              report = reports.get(name)
              if not report:
                  lines.append("| %s | — | — | — | Missing report | — | — |" % name)
                  failed = True
                  continue
              if report["status"] == "analysis_error":
                  lines.append("| %s | — | — | — | Analysis error: %s | — | — |" % (
                      name, report["error"].replace("|", "/")
                  ))
                  failed = True
                  continue
              if report["expected_commit"] != fixture["commit"] or report["actual_commit"] != fixture["commit"]:
                  raise SystemExit("checksum mismatch for " + name)
              if report["probe_count"] != len(fixture["probes"]):
                  raise SystemExit("probe count mismatch for " + name)
              graph = report["graph"]
              lines.append("| %s | %d | %d | %d/%d | %s | %.1f | %s |" % (
                  name, graph["nodes"], graph["edges"], report["matched_probes"],
                  report["probe_count"], ", ".join(report["missing_probes"]) or "none",
                  report["analysis_elapsed_ms"], report["process_peak_rss_kb"],
              ))
          # P1.2 source-grounded facts are now an established regression
          # gate, not expected missing observations. Other unresolved P1.3-6
          # cases remain visible but do not fail this phase's replay.
          p12 = {
              "cbv-book-list-model": "supported",
              "cbv-book-detail-model": "supported",
              "cbv-book-list-default-template": "inferred",
              "cbv-book-detail-default-template": "inferred",
              "cbv-explicit-template": "supported",
          }
          mdn = reports.get("mdn-django-local-library") or {}
          by_id = {row["id"]: row for row in mdn.get("probes", [])}
          p12_gaps = []
          for probe_id, tier in p12.items():
              row = by_id.get(probe_id)
              if not row or row.get("passed") is not True:
                  p12_gaps.append(probe_id + ":not_matched")
                  continue
              edges = row["observed"].get("matching_edges") or []
              if len(edges) != 1 or edges[0].get("confidence_tier") != tier:
                  p12_gaps.append(probe_id + ":wrong_provenance_tier")
          if p12_gaps:
              failed = True
              lines.extend([
                  "",
                  "P1.2 Django model/template regression: FAIL " + ", ".join(p12_gaps),
              ])
          else:
              lines.extend([
                  "",
                  "**P1.2 Django CBV model/template regression: PASS (5/5, expected evidence tiers).**",
              ])
          # P1.2 acceptance: preserve the five Django CBV facts that this
          # checkpoint is responsible for. The named URL remains P1.4.
          mdn = reports.get("mdn-django-local-library")
          if mdn and mdn.get("status") != "analysis_error":
              p12_required = {
                  "cbv-book-list-model",
                  "cbv-book-detail-model",
                  "cbv-book-list-default-template",
                  "cbv-book-detail-default-template",
                  "cbv-explicit-template",
              }
              missing = set(mdn.get("missing_probes", []))
              regressed = sorted(p12_required & missing)
              if regressed:
                  raise SystemExit(
                      "P1.2 Django CBV regression: " + ", ".join(regressed)
                  )

          # P1.3: source-tree AppConfig membership remains inspectable, but
          # zero synthetic DEPENDS_ON edges may feed impact and region locality.
          p13_requirements = {
              "mdn-django-local-library": 29,
              "django-rest-framework": 20,
              "grinberg-microblog": 0,
          }
          p13_gaps = []
          for fixture_id, expected_count in p13_requirements.items():
              graph = (reports.get(fixture_id) or {}).get("graph") or {}
              actual = graph.get("app_config_source_membership_count")
              edges = graph.get("app_config_membership_edges")
              if actual != expected_count or edges != 0:
                  p13_gaps.append(
                      "%s:source_memberships=%s(expected %d),hub_edges=%s(expected 0)"
                      % (fixture_id, actual, expected_count, edges)
                  )
          mdn_impact = (reports.get("mdn-django-local-library") or {}).get(
              "p1_3_django_impact"
          ) or {}
          if mdn_impact.get("passed") is not True:
              p13_gaps.append(
                  "MDN impact/locality: " + str(mdn_impact.get("status", "missing_report"))
              )
          if p13_gaps:
              failed = True
              lines.extend([
                  "",
                  "P1.3 structural membership / no-dependency-hub gate: FAIL "
                  + "; ".join(p13_gaps),
              ])
          else:
              lines.extend([
                  "",
                  "**P1.3 AppConfig gate: PASS (29 MDN + 20 DRF retained structural "
                  "memberships; 0 synthetic dependency edges; MDN impact and "
                  "region-locality isolation verified; Flask control 0).**",
              ])

          # P1.4: the immutable MDN named registration is now a required,
          # source-authored fact. Presence of an arbitrary name string or
          # generic route contract alone does not meet this gate.
          p14_gaps = []
          named = by_id.get("named-url-books") or {}
          matching = (named.get("observed") or {}).get("matching_named_contracts") or []
          if named.get("passed") is not True or len(matching) != 1:
              p14_gaps.append("MDN named-url-books missing/ambiguous")
          else:
              contract = matching[0]
              if (
                  contract.get("target") != "/catalog/books/"
                  or contract.get("route_name") != "books"
                  or float(contract.get("confidence", 0)) < 0.9
              ):
                  p14_gaps.append("MDN named-url-books wrong registration evidence/path")
          if p14_gaps:
              failed = True
              lines.extend(["", "P1.4 Django named URL gate: FAIL " + "; ".join(p14_gaps)])
          else:
              lines.extend([
                  "",
                  "**P1.4 Django named URL gate: PASS "
                  "(MDN books registration, source line, static provenance and route).**",
              ])

          # P1.5: source-authored Microblog POST+DELETE are accepted only
          # when sourced to the registered api Blueprint and the exact
          # static app/__init__.py registration, not merely a matching URL.
          p15_gaps = []
          microblog = reports.get("grinberg-microblog") or {}
          microblog_probes = {
              row["id"]: row for row in microblog.get("probes", [])
          }
          for probe_id, method, route_line in (
              ("api-token-post", "POST", 6),
              ("api-token-delete", "DELETE", 14),
          ):
              row = microblog_probes.get(probe_id) or {}
              matches = [
                  item for item in ((row.get("observed") or {}).get("observed_contracts") or [])
                  if item.get("target") == "/api/tokens"
                  and item.get("methods") == [method]
                  and item.get("source_file") == "app/api/tokens.py"
                  and item.get("source_line") == route_line
                  and item.get("registration_file") == "app/__init__.py"
                  and item.get("blueprint_declaration_file") == "app/api/__init__.py"
                  and item.get("blueprint_id") == "app.api.bp"
                  and item.get("url_prefix") == "/api"
                  and item.get("derivation") == "flask.blueprint.registered_route"
                  and item.get("evidence_kind") == "static"
                  and float(item.get("confidence", 0)) >= 0.9
              ]
              if row.get("passed") is not True or len(matches) != 1:
                  p15_gaps.append(probe_id + ":registration_or_method_not_grounded")
              if any(
                  item.get("target") == "/tokens"
                  for item in ((row.get("observed") or {}).get("observed_contracts") or [])
              ):
                  p15_gaps.append(probe_id + ":unregistered_raw_fragment_exposed")
          if p15_gaps:
              failed = True
              lines.extend([
                  "", "P1.5 Flask Blueprint gate: FAIL " + "; ".join(p15_gaps),
              ])
          else:
              lines.extend([
                  "", "**P1.5 Flask Blueprint gate: PASS "
                  "(pinned Microblog POST and DELETE /api/tokens, "
                  "declaration + registration provenance, no raw /tokens exposure).**",
              ])

          # P1.6: Source-backed DRF metaclass Field identity must reach
          # graph activation in the pinned serializer query. Final delivery
          # is a separate context-packing question (explicitly deferred P2),
          # so do NOT turn a still-missing delivery probe into a false pass.
          p16_gaps = []
          drf = reports.get("django-rest-framework") or {}
          drf_probes = {row["id"]: row for row in drf.get("probes", [])}
          field_usage = drf.get("p1_6_drf_field_usage") or {}
          if (
              field_usage.get("passed") is not True
              or field_usage.get("source_evidenced_edge_count") != 1
              or field_usage.get("metaclass_method_count") != 1
              or field_usage.get("field_target_count") != 1
          ):
              p16_gaps.append("DRF core declared Field use missing/ambiguous")
          serializer = ((drf_probes.get("serializer-implementation-recall") or {})
                        .get("observed") or {})
          activated = set(serializer.get("activated_files") or [])
          if not {
              "rest_framework/serializers.py", "rest_framework/fields.py",
          }.issubset(activated):
              p16_gaps.append("DRF serializer+fields implementation not activated")

          # V2 diagnoses unmatched *contracts*, not failed relationships.
          # In particular, server endpoints need no in-repo clients, Python
          # builtins are a separate denominator, and dynamic source
          # declarations remain framework-local unknowns.
          for fixture_id, report in reports.items():
              graph = report.get("graph") or {}
              v2 = graph.get("integration_diagnostics_v2") or {}
              raw = graph.get("unresolved_contract_count")
              classified = v2.get("classified_unmatched_contract_count")
              count_by_category = v2.get("counts_by_category") or {}
              review = v2.get("actionable_review_candidate_count")
              ordinary = v2.get("non_actionable_or_unproven_count")
              if (
                  not isinstance(raw, int)
                  or raw != v2.get("raw_unmatched_contract_count")
                  or raw != classified
                  or raw != sum(count_by_category.values())
                  or not isinstance(review, int)
                  or not isinstance(ordinary, int)
                  or review + ordinary != raw
              ):
                  p16_gaps.append(fixture_id + ":diagnostic_denominator_mismatch")
          drf_v2 = (drf.get("graph") or {}).get("integration_diagnostics_v2") or {}
          if drf_v2.get("python_intrinsic_unresolved_calls", 0) <= 0:
              p16_gaps.append("DRF ordinary Python builtins not separated")
          if drf_v2.get("counts_by_category", {}).get(
              "available_boundary_without_local_consumer", 0
          ) <= 0:
              p16_gaps.append("DRF server endpoint missing non-actionable category")
          if p16_gaps:
              failed = True
              lines.extend([
                  "", "P1.6 DRF/diagnostic gate: FAIL " + "; ".join(p16_gaps),
              ])
          else:
              delivered = set(serializer.get("delivered_files") or [])
              pending = sorted({
                  "rest_framework/serializers.py", "rest_framework/fields.py",
              } - delivered)
              lines.extend([
                  "",
                  "**P1.6 DRF/diagnostic gate: PASS (pinned SerializerMetaclass "
                  "source usage -> Field; both DRF implementation files "
                  "activated; raw vs reviewable unmatched-contract counts "
                  "internally consistent; Python builtins separated).**",
                  "",
                  "Delivery still missing %s under the existing context "
                  "packer (P2 policy, not silently counted as a probe pass)."
                  % (", ".join(pending) if pending else "none"),
                  "",
                  "DRF unmatched integration contracts: %s raw; %s "
                  "review candidates; %s non-actionable/unproven; %s "
                  "unresolved Python builtin calls counted separately."
                  % (
                      drf_v2.get("raw_unmatched_contract_count"),
                      drf_v2.get("actionable_review_candidate_count"),
                      drf_v2.get("non_actionable_or_unproven_count"),
                      drf_v2.get("python_intrinsic_unresolved_calls"),
                  ),
              ])

          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          report = {
              "schema": "feynmap.p1_external_baseline_collection.v1",
              "status": "analysis_error" if failed else "baseline_captured_with_known_gaps",
              "fixtures": [
                  {
                      "id": entry["id"],
                      "commit": entry["commit"],
                      "analysis_status": reports.get(entry["id"], {}).get("status", "missing_report"),
                      "passed": reports.get(entry["id"], {}).get("matched_probes"),
                      "total": len(entry["probes"]),
                      "missing_probes": reports.get(entry["id"], {}).get("missing_probes", []),
                  }
                  for entry in manifest["fixtures"]
              ],
              "p1_2_django_cbv_gate": "fail" if p12_gaps else "pass",
              "p1_2_missing_or_wrong_tier": p12_gaps,
              "p1_3_app_config_hub_gate": "fail" if p13_gaps else "pass",
              "p1_3_membership_or_edge_mismatch": p13_gaps,
              "p1_4_named_url_gate": "fail" if p14_gaps else "pass",
              "p1_4_named_url_gaps": p14_gaps,
              "p1_5_flask_blueprint_gate": "fail" if p15_gaps else "pass",
              "p1_5_blueprint_gaps": p15_gaps,
              "p1_6_drf_diagnostic_gate": "fail" if p16_gaps else "pass",
              "p1_6_drf_diagnostic_gaps": p16_gaps,
              "note": "Known unresolved later probes stay visible; P1.2's five verified facts must not regress.",
          }
          Path("p1-external-summary.json").write_text(json.dumps(report, indent=2) + "\n")
          if failed or os.environ["P1_JOB_RESULT"] != "success":
              raise SystemExit("At least one pinned external checkout could not be analyzed")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p1-external-baseline-summary
          path: p1-external-summary.json
          if-no-files-found: warn
