name: rust-native-build

on:
  push:
    paths:
      - "native/routing_kernel/**"
      - "feynmap/native_routing.py"
      - "feynmap/rust_routing_boundary.py"
      - "tests/test_native_routing_integration.py"
      - "experiments/rust_region_routing_s6.json"
      - "feynmap/rust_routing_conformance.py"
      - "feynmap/rust_routing_performance.py"
      - "feynmap/rust_routing_workflow.py"
      - "feynmap/routing.py"
      - "tests/test_optional_native_routing.py"
      - "experiments/sparse_activation_feynmap_s0.json"
      - "tests/test_rust_routing_performance.py"
      - "tests/test_rust_routing_conformance_spec.py"
      - "tests/test_rust_routing_validation.py"
      - "tests/fixtures/contracts/s6_7_routing_oracles.json"
      - ".github/workflows/rust-native-build.yml"
  pull_request:
    paths:
      - "native/routing_kernel/**"
      - "feynmap/native_routing.py"
      - "feynmap/rust_routing_boundary.py"
      - "tests/test_native_routing_integration.py"
      - "experiments/rust_region_routing_s6.json"
      - "feynmap/rust_routing_conformance.py"
      - "feynmap/rust_routing_performance.py"
      - "feynmap/rust_routing_workflow.py"
      - "feynmap/routing.py"
      - "tests/test_optional_native_routing.py"
      - "experiments/sparse_activation_feynmap_s0.json"
      - "tests/test_rust_routing_performance.py"
      - "tests/test_rust_routing_conformance_spec.py"
      - "tests/test_rust_routing_validation.py"
      - "tests/fixtures/contracts/s6_7_routing_oracles.json"
      - ".github/workflows/rust-native-build.yml"
  workflow_dispatch:

jobs:
  build-abi3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python package and maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install maturin==1.15.0 pytest
      - name: Show native build toolchain
        run: |
          python --version
          rustc --version
          cargo --version
          maturin --version
      - name: Build abi3 native wheel
        run: |
          cd native/routing_kernel
          maturin build --release --interpreter python --out ../../native-dist
      - name: Install and import native extension on Python 3.8
        run: |
          python -m pip install native-dist/*.whl
          python - <<'PY'
          import _feynmap_native_routing as native
          from feynmap.native_routing import native_routing_info

          assert native.abi_version() == "1.0.0"
          assert native.implementation() == "rust-pyo3"
          info = native_routing_info()
          assert info["available"] is True
          assert info["abi_version"] == "1.0.0"
          assert info["implementation"] == "rust-pyo3"
          print(info)
          PY
      - name: Test compiled Rust kernel against Python reference
        run: python -m pytest tests/test_native_routing_integration.py -q
      - name: Run S6.7 independent and differential conformance on Python 3.8
        run: |
          python -m feynmap.rust_routing_conformance \
            --repo-root . \
            --output performance-results/s6-7-native-conformance-py38.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s6-7-native-conformance-py38
          path: performance-results/s6-7-native-conformance-py38.json
          if-no-files-found: warn
      - name: Measure S6.8 paired Python 3.8 route performance
        run: |
          python -m feynmap.rust_routing_performance \
            experiments/rust_region_routing_s6.json . \
            --output performance-results/s6-8-routing-py38.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s6-8-routing-performance-py38
          path: performance-results/s6-8-routing-py38.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: feynmap-native-routing-abi3
          path: native-dist/*.whl

  import-python312:
    needs: build-abi3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python FeynMap
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - uses: actions/download-artifact@v4
        with:
          name: feynmap-native-routing-abi3
          path: native-dist
      - name: Install Python 3.8 abi3 wheel on Python 3.12
        run: |
          python -m pip install native-dist/*.whl
          python - <<'PY'
          import _feynmap_native_routing as native
          from feynmap.native_routing import native_routing_info

          assert native.abi_version() == "1.0.0"
          assert native.implementation() == "rust-pyo3"
          info = native_routing_info()
          assert info["available"] is True
          print(info)
          PY
      - name: Test same wheel's native kernel on Python 3.12
        run: python -m pytest tests/test_native_routing_integration.py -q
      - name: Run S6.7 independent and differential conformance on Python 3.12
        run: |
          python -m feynmap.rust_routing_conformance \
            --repo-root . \
            --output performance-results/s6-7-native-conformance-py312.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s6-7-native-conformance-py312
          path: performance-results/s6-7-native-conformance-py312.json
          if-no-files-found: warn
      - name: Measure S6.8 paired Python 3.12 route performance
        run: |
          python -m feynmap.rust_routing_performance \
            experiments/rust_region_routing_s6.json . \
            --output performance-results/s6-8-routing-py312.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s6-8-routing-performance-py312
          path: performance-results/s6-8-routing-py312.json
          if-no-files-found: error
      - name: S6.9 full region-first and minimal-context workflow
        run: |
          python -m feynmap.rust_routing_workflow \
            experiments/sparse_activation_feynmap_s0.json . \
            --samples 5 --strategy region \
            --output performance-results/s6-9-region-workflow.json
      - name: S6.9 adaptive local-stop and native lazy-setup workflow
        run: |
          python -m feynmap.rust_routing_workflow \
            experiments/sparse_activation_feynmap_s0.json . \
            --samples 5 --strategy adaptive \
            --output performance-results/s6-9-adaptive-workflow.json
      - name: Enforce S6.9 quality, genuine Rust usage and adaptive laziness
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          region = json.loads(Path("performance-results/s6-9-region-workflow.json").read_text())
          adaptive = json.loads(Path("performance-results/s6-9-adaptive-workflow.json").read_text())
          for report, strategy in ((region, "region"), (adaptive, "adaptive")):
              assert report["status"] == "pass", (strategy, report.get("error"))
              assert report["strategy"] == strategy
              assert report["quality"]["full_recall_tasks"] == 6
              assert report["quality"]["identical_route_selection"] is True
              assert report["quality"]["identical_delivered_nodes"] is True
              assert report["quality"]["identical_essential_recall"] is True
              assert report["quality"]["identical_delivered_context_tokens"] is True
              assert all(row["native_fallbacks"] == 0 for row in report["native_usage"])
          assert region["measurement"]["regression_gate_applicable"] is True
          assert all(row["native_route_calls"] > 0 for row in region["native_usage"])
          assert all(
              row["active_native_indexes"] == row["native_setup_attempts"] == 1
              for row in region["native_usage"]
          )
          if not adaptive["measurement"]["regression_gate_applicable"]:
              assert all(
                  row["native_route_calls"] == row["native_setup_attempts"] == 0
                  for row in adaptive["native_usage"]
              )
          lines = [
              "## S6.9 optional Rust integration: complete recursive workflow",
              "",
              "| Workload | Python median ms | Opt-in native median ms | Native/Python | Native route calls/sample | Outcome |",
              "|---|---:|---:|---:|---:|---|",
          ]
          for report in (region, adaptive):
              m = report["measurement"]
              calls = report["native_usage"][0]["native_route_calls"]
              lines.append("| %s + minimal | %.3f | %.3f | %.4f | %d | %s |" % (
                  report["strategy"], m["python_median_ms"],
                  m["native_median_ms"], m["native_to_python_time_ratio"],
                  calls, report["status"],
              ))
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s6-9-full-workflow
          path: |
            performance-results/s6-9-region-workflow.json
            performance-results/s6-9-adaptive-workflow.json
          if-no-files-found: warn


  performance-acceptance:
    needs: [build-abi3, import-python312]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: s6-8-routing-performance-py38
          path: collected/py38
      - uses: actions/download-artifact@v4
        with:
          name: s6-8-routing-performance-py312
          path: collected/py312
      - name: Enforce S6.8 end-to-end acceptance on both interpreters
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          reports = [
              json.loads(Path("collected/py38/s6-8-routing-py38.json").read_text()),
              json.loads(Path("collected/py312/s6-8-routing-py312.json").read_text()),
          ]
          lines = [
              "## S6.8 native route performance (paired, same runner per interpreter)",
              "",
              "| Python | Python route (us) | Full native route (us) | Speedup | Extra setup (ms) | Break-even calls | Decision |",
              "|---|---:|---:|---:|---:|---:|---|",
          ]
          for report in reports:
              decision = report["decision"]
              assert report["workload"]["quality_equivalence"] is True
              assert report["production_router_unchanged"] is True
              assert report["workload"]["paired_samples"] >= 5
              assert report["workload"]["route_calls_per_sample"] == 1200
              assert decision["minimum_speedup"] == 2.0
              lines.append(
                  "| %s | %.2f | %.2f | %.2fx | %.2f | %s | %s |" % (
                      report["environment"]["python"],
                      decision["python_mean_route_us"],
                      decision["native_mean_route_us"],
                      decision["end_to_end_route_speedup"],
                      decision["extra_setup_ms"],
                      decision["break_even_route_calls"],
                      decision["status"],
                  )
              )
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(summary)
          if any(report["decision"]["status"] != "pass" for report in reports):
              raise SystemExit("S6.8: native end-to-end routing did not meet >=2.0x on both interpreters")
          PY
