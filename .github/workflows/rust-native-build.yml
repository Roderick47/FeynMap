name: rust-native-build

on:
  push:
    branches:
      - feature/rust-routing-kernel
  workflow_dispatch:

jobs:
  build-abi3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Python package and maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install maturin==1.15.0
      - name: Show native build toolchain
        run: |
          python --version
          rustc --version
          cargo --version
          maturin --version
      - name: Build abi3 native wheel
        run: |
          cd native/routing_kernel
          maturin build --release --interpreter python --out ../../native-dist
      - name: Install and import native extension on Python 3.8
        run: |
          python -m pip install native-dist/*.whl
          python - <<'PY'
          import _feynmap_native_routing as native
          from feynmap.native_routing import native_routing_info

          assert native.abi_version() == "1.0.0"
          assert native.implementation() == "rust-pyo3"
          info = native_routing_info()
          assert info["available"] is True
          assert info["abi_version"] == "1.0.0"
          assert info["implementation"] == "rust-pyo3"
          print(info)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: feynmap-native-routing-abi3
          path: native-dist/*.whl

  import-python312:
    needs: build-abi3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python FeynMap
        run: python -m pip install -e .
      - uses: actions/download-artifact@v4
        with:
          name: feynmap-native-routing-abi3
          path: native-dist
      - name: Install Python 3.8 abi3 wheel on Python 3.12
        run: |
          python -m pip install native-dist/*.whl
          python - <<'PY'
          import _feynmap_native_routing as native
          from feynmap.native_routing import native_routing_info

          assert native.abi_version() == "1.0.0"
          assert native.implementation() == "rust-pyo3"
          info = native_routing_info()
          assert info["available"] is True
          print(info)
          PY
