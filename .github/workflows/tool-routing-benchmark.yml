name: tool-routing-benchmark

on:
  push:
    branches:
      - feature/tool-space-routing
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FeynMap
        run: python -m pip install -e .
      - name: Run S5 tool-routing benchmark
        run: |
          python -m feynmap.tool_routing_benchmark \
            experiments/tool_routing_s5.json \
            --output benchmark-results/tool-routing-s5.json
      - name: Write benchmark summary
        run: |
          python - <<'PY'
          import json
          import os

          with open("benchmark-results/tool-routing-s5.json", "r", encoding="utf-8") as handle:
              result = json.load(handle)
          summary = result["summary"]
          lines = [
              "## S5 tool routing and schema delivery",
              "",
              "| Tasks | Top-1 accuracy | MRR | Delivery recall | Unmatched accuracy | Schema-token reduction |",
              "|---:|---:|---:|---:|---:|---:|",
              "| %d | %.3f | %.3f | %.3f | %.3f | %.1f%% |" % (
                  result["task_count"],
                  summary["top1_accuracy"],
                  summary["mean_reciprocal_rank"],
                  summary["mean_delivery_recall"],
                  summary["unmatched_accuracy"],
                  100.0 * summary["schema_token_reduction_ratio"],
              ),
          ]
          rendered = "\n".join(lines) + "\n"
          print(rendered)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(rendered)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tool-routing-benchmark
          path: benchmark-results/tool-routing-s5.json
