name: substrate-baseline

on:
  push:
    branches:
      - feature/sparse-knowledge-substrate
      - feature/region-first-activation
      - feature/adaptive-sufficiency
      - feature/minimal-sufficient-context
      - feature/active-state
  workflow_dispatch:

jobs:
  substrate-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout FeynMap
        uses: actions/checkout@v4
        with:
          path: feynmap-src

      - name: Checkout Wikonomi V2 history
        uses: actions/checkout@v4
        with:
          repository: Roderick47/wikonomi-v2
          ref: main
          fetch-depth: 0
          path: wikonomi-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FeynMap
        run: python -m pip install -e ./feynmap-src

      - name: Run FeynMap self comparison
        run: |
          for strategy in flat region adaptive; do
            python -m feynmap.activation_benchmark \
              feynmap-src/experiments/sparse_activation_feynmap_s0.json \
              feynmap-src \
              --strategy "$strategy" \
              --output "baseline-results/feynmap-$strategy.json"
          done
          python -m feynmap.activation_benchmark \
            feynmap-src/experiments/sparse_activation_feynmap_s0.json \
            feynmap-src \
            --strategy adaptive \
            --context-strategy minimal \
            --output baseline-results/feynmap-adaptive-minimal.json

      - name: Run S4 active-state long-horizon self comparison
        run: |
          python -m feynmap.active_state_benchmark \
            feynmap-src/experiments/active_state_feynmap_s4.json \
            feynmap-src \
            --output baseline-results/feynmap-active-state.json

      - name: Run pinned Wikonomi v1F comparison
        run: |
          python - <<'PY' > /tmp/wikonomi_tasks.tsv
          import json
          with open("feynmap-src/experiments/sparse_activation_wikonomi_s0.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          for task in data["tasks"]:
              print("%s\t%s" % (task["id"], task["revision"]))
          PY

          while IFS=$'\t' read -r task revision; do
            echo "Benchmarking $task at $revision"
            git -C wikonomi-v2 checkout --force --detach "$revision"
            for strategy in flat region adaptive; do
              python -m feynmap.activation_benchmark \
                feynmap-src/experiments/sparse_activation_wikonomi_s0.json \
                wikonomi-v2 \
                --task "$task" \
                --strategy "$strategy" \
                --output "baseline-results/wikonomi-$task-$strategy.json"
            done
            python -m feynmap.activation_benchmark \
              feynmap-src/experiments/sparse_activation_wikonomi_s0.json \
              wikonomi-v2 \
              --task "$task" \
              --strategy adaptive \
              --context-strategy minimal \
              --output "baseline-results/wikonomi-$task-adaptive-minimal.json"
          done < /tmp/wikonomi_tasks.tsv

      - name: Write benchmark summary
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          def load(path):
              with open(path, "r", encoding="utf-8") as handle:
                  return json.load(handle)

          def mean(values):
              values = [value for value in values if value is not None]
              return sum(values) / len(values) if values else None

          def aggregate(label, strategy, results):
              task_rows = [task for result in results for task in result["tasks"]]
              metrics = [task["metrics"] for task in task_rows]
              return {
                  "label": label,
                  "strategy": strategy,
                  "touch": mean([m["candidate_touch_ratio"] for m in metrics]),
                  "activation": mean([m["knowledge_activation_ratio"] for m in metrics]),
                  "delivery": mean([m["delivery_to_activation_ratio"] for m in metrics]),
                  "latency": mean([m["routing_elapsed_ms"] for m in metrics]),
                  "compact_active_tokens": mean([m["activated_context_tokens"] for m in metrics]),
                  "model_active_tokens": mean([task.get("model_activated_context_tokens") for task in task_rows]),
                  "delivered_tokens": mean([task.get("delivered_context_tokens") for task in task_rows]),
                  "compression": mean([task.get("token_compression_ratio") for task in task_rows]),
                  "activation_recall": mean([task.get("activation_essential_recall") for task in task_rows]),
                  "recall": mean([task["essential_recall"] for task in task_rows]),
                  "retention": mean([task.get("quality_retention_ratio") for task in task_rows]),
                  "full": sum(1 for task in task_rows if task["essential_full_recall"]),
                  "count": len(task_rows),
                  "local_stops": sum(
                      1 for task in task_rows
                      if (task.get("adaptive") or {}).get("stage") == "local"
                  ),
                  "region_escalations": sum(
                      1 for task in task_rows
                      if "region" in ((task.get("adaptive") or {}).get("escalations") or [])
                  ),
              }

          rows = []
          for strategy in ("flat", "region", "adaptive"):
              rows.append(aggregate(
                  "FeynMap",
                  "region-hybrid" if strategy == "region" else strategy,
                  [load("baseline-results/feynmap-%s.json" % strategy)],
              ))
          rows.append(aggregate(
              "FeynMap",
              "adaptive+minimal",
              [load("baseline-results/feynmap-adaptive-minimal.json")],
          ))

          for strategy in ("flat", "region", "adaptive"):
              files = sorted(glob.glob("baseline-results/wikonomi-*-%s.json" % strategy))
              # Exclude adaptive-minimal files from the plain adaptive glob.
              files = [path for path in files if "adaptive-minimal" not in path]
              rows.append(aggregate(
                  "Wikonomi v1F",
                  "region-hybrid" if strategy == "region" else strategy,
                  [load(path) for path in files],
              ))
          minimal_files = sorted(glob.glob("baseline-results/wikonomi-*-adaptive-minimal.json"))
          rows.append(aggregate(
              "Wikonomi v1F",
              "adaptive+minimal",
              [load(path) for path in minimal_files],
          ))

          lines = [
              "## FeynMap sparse activation + minimal context comparison",
              "",
              "| Repository | Strategy | Candidate touch | Activation | Delivery/activation | Routing ms | Model ctx before | Model ctx delivered | Token ratio | Activated recall | Delivered recall | Quality retention | Full recall |",
              "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for row in rows:
              lines.append(
                  "| %s | %s | %.4f | %.4f | %.4f | %.3f | %.1f | %.1f | %.3f | %.3f | %.3f | %.3f | %d/%d |"
                  % (
                      row["label"],
                      row["strategy"],
                      row["touch"] or 0.0,
                      row["activation"] or 0.0,
                      row["delivery"] or 0.0,
                      row["latency"] or 0.0,
                      row["model_active_tokens"] or 0.0,
                      row["delivered_tokens"] or 0.0,
                      row["compression"] or 0.0,
                      row["activation_recall"] or 0.0,
                      row["recall"] or 0.0,
                      row["retention"] or 0.0,
                      row["full"],
                      row["count"],
                  )
              )

          active_state_path = "baseline-results/feynmap-active-state.json"
          if os.path.exists(active_state_path):
              active_state = load(active_state_path)
              s4 = active_state["summary"]
              lines.extend([
                  "",
                  "## S4 active-state long-horizon comparison",
                  "",
                  "| Steps | Active-state reuse | Re-expansions | Essential recall | Fresh context accumulated | Final active context | Growth avoided |",
                  "|---:|---:|---:|---:|---:|---:|---:|",
                  "| %d | %d | %d | %.3f | %d | %d | %.1f%% |"
                  % (
                      active_state["step_count"],
                      s4["reuse_steps"],
                      s4["reexpanded_steps"],
                      s4["mean_active_essential_recall"],
                      s4["cumulative_fresh_context_tokens"],
                      s4["final_active_working_context_tokens"],
                      100.0 * s4["retained_context_growth_avoided_ratio"],
                  ),
              ])

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: sparse-activation-comparison
          path: baseline-results/*.json
