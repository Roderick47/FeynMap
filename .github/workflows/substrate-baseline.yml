name: substrate-baseline

on:
  push:
    branches:
      - feature/sparse-knowledge-substrate
      - feature/region-first-activation
  workflow_dispatch:

jobs:
  substrate-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout FeynMap
        uses: actions/checkout@v4
        with:
          path: feynmap-src

      - name: Checkout Wikonomi V2
        uses: actions/checkout@v4
        with:
          repository: Roderick47/wikonomi-v2
          ref: main
          path: wikonomi-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FeynMap
        run: python -m pip install -e ./feynmap-src

      - name: Run FeynMap flat query-aware search
        run: |
          python -m feynmap.activation_benchmark \
            feynmap-src/experiments/sparse_activation_feynmap_s0.json \
            feynmap-src \
            --strategy flat \
            --output baseline-results/feynmap-flat.json

      - name: Run FeynMap region-first search
        run: |
          python -m feynmap.activation_benchmark \
            feynmap-src/experiments/sparse_activation_feynmap_s0.json \
            feynmap-src \
            --strategy region \
            --output baseline-results/feynmap-region.json

      - name: Run Wikonomi flat query-aware search
        run: |
          python -m feynmap.activation_benchmark \
            feynmap-src/experiments/sparse_activation_wikonomi_s0.json \
            wikonomi-v2 \
            --strategy flat \
            --output baseline-results/wikonomi-flat.json

      - name: Run Wikonomi region-first search
        run: |
          python -m feynmap.activation_benchmark \
            feynmap-src/experiments/sparse_activation_wikonomi_s0.json \
            wikonomi-v2 \
            --strategy region \
            --output baseline-results/wikonomi-region.json

      - name: Write benchmark summary
        run: |
          python - <<'PY'
          import json
          import os

          rows = []
          for label, strategy, path in (
              ("FeynMap", "flat-query-aware", "baseline-results/feynmap-flat.json"),
              ("FeynMap", "region", "baseline-results/feynmap-region.json"),
              ("Wikonomi V2", "flat-query-aware", "baseline-results/wikonomi-flat.json"),
              ("Wikonomi V2", "region", "baseline-results/wikonomi-region.json"),
          ):
              with open(path, "r", encoding="utf-8") as handle:
                  data = json.load(handle)
              summary = data["summary"]
              rows.append(
                  (
                      label,
                      strategy,
                      data["analysis"]["graph_nodes"],
                      summary["mean_candidate_touch_ratio"],
                      summary["mean_knowledge_activation_ratio"],
                      summary["mean_region_touch_ratio"],
                      summary["mean_routing_elapsed_ms"],
                      summary["mean_activated_context_tokens"],
                      summary["mean_essential_recall"],
                      summary["full_recall_tasks"],
                      data["task_count"],
                  )
              )

          lines = [
              "## FeynMap sparse activation comparison",
              "",
              "| Repository | Strategy | Nodes | Candidate touch | Knowledge activation | Region touch | Routing ms | Active ctx tokens | Essential recall | Full recall |",
              "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for row in rows:
              label, strategy, nodes, touch, activation, region_touch, latency, tokens, recall, full, count = row
              lines.append(
                  "| %s | %s | %d | %.4f | %.4f | %s | %.3f | %.1f | %.3f | %d/%d |"
                  % (
                      label,
                      strategy,
                      nodes,
                      touch or 0.0,
                      activation or 0.0,
                      ("%.4f" % region_touch) if region_touch is not None else "-",
                      latency or 0.0,
                      tokens or 0.0,
                      recall or 0.0,
                      full,
                      count,
                  )
              )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: sparse-activation-comparison
          path: baseline-results/*.json
