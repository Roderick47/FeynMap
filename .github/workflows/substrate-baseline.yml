name: substrate-baseline

on:
  push:
    branches:
      - feature/sparse-knowledge-substrate
      - feature/region-first-activation
  workflow_dispatch:

jobs:
  substrate-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout FeynMap
        uses: actions/checkout@v4
        with:
          path: feynmap-src

      - name: Checkout Wikonomi V2 history
        uses: actions/checkout@v4
        with:
          repository: Roderick47/wikonomi-v2
          ref: main
          fetch-depth: 0
          path: wikonomi-v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FeynMap
        run: python -m pip install -e ./feynmap-src

      - name: Run FeynMap self comparison
        run: |
          python -m feynmap.activation_benchmark \
            feynmap-src/experiments/sparse_activation_feynmap_s0.json \
            feynmap-src \
            --strategy flat \
            --output baseline-results/feynmap-flat.json
          python -m feynmap.activation_benchmark \
            feynmap-src/experiments/sparse_activation_feynmap_s0.json \
            feynmap-src \
            --strategy region \
            --output baseline-results/feynmap-region.json

      - name: Run pinned Wikonomi v1F comparison
        run: |
          python - <<'PY' > /tmp/wikonomi_tasks.tsv
          import json
          with open("feynmap-src/experiments/sparse_activation_wikonomi_s0.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          for task in data["tasks"]:
              print("%s\t%s" % (task["id"], task["revision"]))
          PY

          while IFS=$'\t' read -r task revision; do
            echo "Benchmarking $task at $revision"
            git -C wikonomi-v2 checkout --force --detach "$revision"
            python -m feynmap.activation_benchmark \
              feynmap-src/experiments/sparse_activation_wikonomi_s0.json \
              wikonomi-v2 \
              --task "$task" \
              --strategy flat \
              --output "baseline-results/wikonomi-$task-flat.json"
            python -m feynmap.activation_benchmark \
              feynmap-src/experiments/sparse_activation_wikonomi_s0.json \
              wikonomi-v2 \
              --task "$task" \
              --strategy region \
              --output "baseline-results/wikonomi-$task-region.json"
          done < /tmp/wikonomi_tasks.tsv

      - name: Write benchmark summary
        run: |
          python - <<'PY'
          import glob
          import json
          import os

          def load(path):
              with open(path, "r", encoding="utf-8") as handle:
                  return json.load(handle)

          def row_from_result(label, strategy, data):
              s = data["summary"]
              return {
                  "label": label,
                  "strategy": strategy,
                  "nodes": data["analysis"]["graph_nodes"],
                  "touch": s["mean_candidate_touch_ratio"],
                  "activation": s["mean_knowledge_activation_ratio"],
                  "region_touch": s["mean_region_touch_ratio"],
                  "latency": s["mean_routing_elapsed_ms"],
                  "tokens": s["mean_activated_context_tokens"],
                  "recall": s["mean_essential_recall"],
                  "full": s["full_recall_tasks"],
                  "count": data["task_count"],
              }

          rows = [
              row_from_result("FeynMap", "flat", load("baseline-results/feynmap-flat.json")),
              row_from_result("FeynMap", "region-hybrid", load("baseline-results/feynmap-region.json")),
          ]

          for strategy in ("flat", "region"):
              files = sorted(glob.glob("baseline-results/wikonomi-*-%s.json" % strategy))
              results = [load(path) for path in files]
              task_rows = [result["tasks"][0] for result in results]
              metrics = [task["metrics"] for task in task_rows]
              region_routes = [task["region_route"] for task in task_rows if task.get("region_route")]
              mean = lambda values: sum(values) / len(values) if values else None
              rows.append({
                  "label": "Wikonomi v1F",
                  "strategy": "region-hybrid" if strategy == "region" else "flat",
                  "nodes": mean([result["analysis"]["graph_nodes"] for result in results]),
                  "touch": mean([m["candidate_touch_ratio"] for m in metrics]),
                  "activation": mean([m["knowledge_activation_ratio"] for m in metrics]),
                  "region_touch": mean([r["region_touch_ratio"] for r in region_routes]) if region_routes else None,
                  "latency": mean([m["routing_elapsed_ms"] for m in metrics]),
                  "tokens": mean([m["activated_context_tokens"] for m in metrics]),
                  "recall": mean([task["essential_recall"] for task in task_rows]),
                  "full": sum(1 for task in task_rows if task["essential_full_recall"]),
                  "count": len(task_rows),
              })

          lines = [
              "## FeynMap sparse activation comparison",
              "",
              "| Repository | Strategy | Nodes | Candidate touch | Knowledge activation | Region touch | Routing ms | Active ctx tokens | Essential recall | Full recall |",
              "|---|---|---:|---:|---:|---:|---:|---:|---:|---:|",
          ]
          for row in rows:
              lines.append(
                  "| %s | %s | %.0f | %.4f | %.4f | %s | %.3f | %.1f | %.3f | %d/%d |"
                  % (
                      row["label"],
                      row["strategy"],
                      row["nodes"] or 0.0,
                      row["touch"] or 0.0,
                      row["activation"] or 0.0,
                      ("%.4f" % row["region_touch"]) if row["region_touch"] is not None else "-",
                      row["latency"] or 0.0,
                      row["tokens"] or 0.0,
                      row["recall"] or 0.0,
                      row["full"],
                      row["count"],
                  )
              )

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload comparison results
        uses: actions/upload-artifact@v4
        with:
          name: sparse-activation-comparison
          path: baseline-results/*.json
