name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest


  recursive-self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run recursive self-analysis
        run: |
          python -m feynmap.cli self-check . --framework none --output recursive-self-analysis.json
      - name: Enforce recursive quality gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("recursive-self-analysis.json").read_text(encoding="utf-8"))
          gates = report.get("quality_gates", {})
          if gates.get("status") != "pass":
              raise SystemExit(
                  "FeynMap recursive self-check failed: %s"
                  % json.dumps(gates, sort_keys=True)
              )
          print(json.dumps({
              "status": gates.get("status"),
              "architecture_score": report.get("evaluation", {}).get("architecture_score"),
              "missing_symbols": report.get("evaluation", {}).get("missing_symbol_count"),
              "graph_errors": report.get("metrics", {}).get("graph_errors"),
          }, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recursive-self-analysis
          path: recursive-self-analysis.json
